# Builds the Windows version on a GitHub-hosted Windows machine and keeps the .exe
# files as downloadable artifacts (on the run's page, under Artifacts): ARM64 for the
# Windows VM on an Apple Silicon Mac, x64 for most PCs.
name: Windows

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Stow Lab
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish windows/Lab/StowLab.csproj -c Release -r $rid -o "out/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: StowLab-win-x64
          path: out/win-x64/StowLab.exe

      - uses: actions/upload-artifact@v4
        with:
          name: StowLab-win-arm64
          path: out/win-arm64/StowLab.exe
