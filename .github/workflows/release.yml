# Builds Stow and publishes it as a GitHub Release, with Stow.zip attached, so
# anyone can download it from the repo's Releases page.
#
# To publish a new version: GitHub > Actions > Release > Run workflow, and type a
# version number such as 1.1. (Pushing a tag such as v1.1 works too.)
#
# The app is signed "ad hoc" rather than with a paid Apple Developer ID, so on
# another Mac the first launch has to be allowed once in System Settings >
# Privacy & Security > Open Anyway. The release notes below explain that.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, like 1.0 or 1.1"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        run: |
          # From the "Run workflow" box, or from a tag like v1.1.
          VERSION="${VERSION_INPUT:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Version must look like 1.0 or 1.1 (got '$VERSION')"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build Stow.app
        run: |
          # Release build for both Apple Silicon and Intel Macs, signed ad hoc
          # (CODE_SIGN_IDENTITY "-", Xcode's "Sign to Run Locally").
          xcodebuild -project Stow.xcodeproj -target Stow -configuration Release \
            SYMROOT="$PWD/build" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -quiet build
          codesign --verify --deep --strict --verbose=2 build/Release/Stow.app
          lipo -archs build/Release/Stow.app/Contents/MacOS/Stow
          # ditto keeps the app bundle's signature and metadata intact in the zip.
          ditto -c -k --keepParent build/Release/Stow.app Stow.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          1. Download **Stow.zip** below and open it.
          2. Drag **Stow** into your **Applications** folder.
          3. Open Stow. macOS says it can't check Stow for malware: click **Done**.
          4. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to the message about Stow. Confirm with your password or Touch ID.
          5. A tray icon appears in the menu bar. Stow has no Dock icon and no window: pick up any file and the shelf slides in. Settings are in the tray icon's menu.

          Needs **macOS 26 (Tahoe) or later**.

          ## Updating

          Quit Stow (tray icon → Quit Stow), then replace it in Applications with the new download.

          ## Why the warning?

          Stow isn't signed with a paid Apple Developer ID, so macOS can't confirm who made it. Allowing it once in Privacy & Security is enough.
          EOF
          gh release create "v$VERSION" Stow.zip \
            --target "$GITHUB_SHA" \
            --title "Stow $VERSION" \
            --notes-file notes.md
